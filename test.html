<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            transition: opacity 1s linear;
            pointer-events: none;
        }
        #icon {
            position: fixed;
            object-fit: cover;
            border-radius: 8px;
            opacity: 0;
            transition: left 1s linear;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <img id="icon" src="">
    <script>
        var p = new URLSearchParams(window.location.search);
        var x = parseInt(p.get('x'));
        var y = parseInt(p.get('y'));
        var w = parseInt(p.get('w'));
        var h = parseInt(p.get('h'));
        var iconUrl = p.get('icon');

        var overlay = document.getElementById('overlay');
        var icon = document.getElementById('icon');

        // 初始化图标位置和尺寸
        icon.src = iconUrl;
        icon.style.left = x + 'px';
        icon.style.top = y + 'px';
        icon.style.width = w + 'px';
        icon.style.height = h + 'px';

        // 阶段一：遮罩在 1 秒内从 0% 淡入到 50%
        requestAnimationFrame(function () {
            overlay.style.opacity = '0.5';
        });

        // 阶段二：1 秒后，遮罩已完成，图标出现并开始移动
        setTimeout(function () {
            icon.style.opacity = '1';

            // 对称位置：图标右边缘到视口右边的距离 == 图标左边缘到视口左边的距离
            var targetLeft = window.innerWidth - x - w;

            requestAnimationFrame(function () {
                icon.style.left = targetLeft + 'px';
            });
        }, 1000);

        // 阶段三：图标移动完成，通知 SiteHub 跳转
        setTimeout(function () {
            window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
        }, 2100);
    </script>
</body>
</html>
