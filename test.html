<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转测试</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* 50% 透明黑 */
        }
        h1 {
            color: #fff;
            font-family: sans-serif;
            font-size: 6rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            user-select: none;
        }
    </style>
</head>
<body>
    <h1 id="countdown">3</h1>
    <script>
        var n = 3;
        var el = document.getElementById('countdown');
        var timer = setInterval(function() {
            n--;
            if (n > 0) {
                el.textContent = n;
            } else {
                el.textContent = '0';
                clearInterval(timer);
                // 通知 SiteHub 跳转
                window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
            }
        }, 1000);
    </script>
</body>
</html>
