<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <title>sitehub-个人网站聚合平台</title>
    <style>
        body {
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            background-image: url('background.webp');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
        }

        p {
            margin: 0.25em 0;
        }

        .card {
            text-decoration: none;
            color: inherit;
            width: 80%;
            height: 80px;
            padding: 0 8px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.8);
            /* 半透明黑底 */
        }

        .card:link,
        .card:visited,
        .card:hover,
        .card:active {
            text-decoration: none;
            color: inherit;
        }

        .site-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 8px;
        }

        .site-text {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* 改成 center，让内容垂直居中 */
            gap: 4px;
            padding: 12px 0;
            text-align: left;
            /* 关键：文字左对齐 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-text>div {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #text-print {
            min-height: 1.5em;
            width: fit-content;
            /* 宽度跟随内容 */
            margin: 0 auto 24px auto;
            /* 居中 + 底部间距 */
            background: rgba(0, 0, 0, 0.55);
            border-radius: 16px;
            padding: 2px 8px;
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        .footer {
            margin-top: 48px;
            padding: 32px 16px;
            background: rgba(0, 0, 0, 0.85);
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .footer a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #555;
            transition: border-color 0.2s;
        }

        .footer a:hover {
            border-bottom-color: #fff;
        }

        .footer-copy {
            color: #555;
            font-size: 0.8rem;
            margin-top: 16px;
        }
    </style>
</head>

<body>

    <h1>sitehub-个人网站聚合平台</h1>
    <p id="text-print">Hello World!</p>
    <ul class="site-list" id="site-list">

    </ul>
    <footer class="footer">
        <p>想要添加你的网站？</p>
        <p>
            <a href="https://github.com/Vingturbo/sitehub/issues/new?template=Apply_your_website_links.yml"
                target="_blank">
                点击提交 Issue
            </a>
        </p>
        <p>
            <a href="https://github.com/Vingturbo/sitehub" target="_blank">
                GitHub 项目地址
            </a>
        </p>
        <p class="footer-copy">SiteHub © 2026</p>
    </footer>
    <script>
        function handleCardClick(url) {
            window.open(url, '_blank');
        }

        var siteList = document.getElementById('site-list');
        var BASE_URL = window.location.protocol === 'file:'
            ? 'https://raw.githubusercontent.com/Vingturbo/sitehub/refs/heads/main/'
            : './';

        async function main() {
            try {
                siteList.innerHTML = '';
                var indexRes = await fetch(`${BASE_URL}index.txt`);
                var indexText = await indexRes.text();
                var prefixes = indexText
                    .split(/\s+/)
                    .map(p => p.trim())
                    .filter(p => p !== '');

                console.log('前缀列表:', prefixes);
                // ========== 并发获取所有 jsonl ==========
                var promises = prefixes.map(prefix =>
                    fetch(`${BASE_URL}data/${prefix}.jsonl`).then(res => res.text())
                );

                var texts = await Promise.all(promises);

                // ========== 解析并存入数组 ==========
                var allSites = [];

                texts.forEach(text => {
                    text.split('\n').forEach(line => {
                        var trimmed = line.trim();
                        if (trimmed !== '') {
                            allSites.push(JSON.parse(trimmed));
                        }
                    });
                });

                console.log('总站点数:', allSites.length);
                console.log(allSites);

                allSites.forEach(function (site) {
                    var li = document.createElement('li');

                    var a = document.createElement('a');
                    a.className = 'card';
                    a.href = 'javascript:void(0)';
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        handleCardClick(site.url);
                    });

                    var img = document.createElement('img');
                    img.className = 'icon';
                    img.alt = site.name;

                    // 生成首字母 SVG 占位图
                    var firstChar = site.name ? site.name.charAt(0).toUpperCase() : '?';
                    var bgColor = site.color || '#333333';
                    var svgString = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">' +
                        '<rect width="64" height="64" fill="' + bgColor + '" rx="8"/>' +
                        '<text x="32" y="42" font-size="28" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">' + firstChar + '</text>' +
                        '</svg>';
                    var defaultIcon = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

                    img.src = site.icon || defaultIcon;

                    // 图片加载失败时，也替换为生成的首字母图
                    img.onerror = function () {
                        this.onerror = null;
                        this.src = defaultIcon;
                    };

                    var textDiv = document.createElement('div');
                    textDiv.className = 'site-text';

                    var nameEl = document.createElement('div');
                    nameEl.textContent = site.name;

                    var descEl = document.createElement('div');
                    descEl.textContent = (site.description && site.description !== '_No response_')
                        ? site.description
                        : '暂无简介';

                    textDiv.appendChild(nameEl);
                    textDiv.appendChild(descEl);
                    a.appendChild(img);
                    a.appendChild(textDiv);
                    li.appendChild(a);
                    siteList.appendChild(li);
                });
            } catch (err) {
                // 出错 → 显示重试按钮
                console.error(err);
                showRetry("Error: " + err.message);
            }
        }

        function showRetry(err) {
            const ul = document.getElementById('site-list');
            ul.innerHTML = ''; // 清空旧内容

            // 创建 li > a 结构
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = 'javascript:void(0)';
            a.textContent = '加载失败，点击重试';
            a.style.cursor = 'pointer';
            a.style.color = '#fff';
            a.style.textDecoration = 'underline';

            a.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.reload();
            });

            li.appendChild(a);
            ul.appendChild(li);
        }
        // 延迟辅助函数
        var sleep = ms => new Promise(r => setTimeout(r, ms));

        async function typeWriter() {
            var p = document.getElementById('text-print');
            if (!p) return;

            try {
                // 读取 say.txt（复用 BASE_URL，这样本地和线上都能用）
                var res = await fetch(`${BASE_URL}say.txt`);
                if (!res.ok) return; // 读取失败就静默退出，不要影响主列表
                var text = await res.text();

                // 按行分割，过滤空行
                var lines = text.split('\n').map(s => s.trim()).filter(s => s !== '');
                if (lines.length === 0) return;
                p.textContent = ''; // 清空初始文本
                while (true) {
                    // 随机选一行
                    var randomLine = lines[Math.floor(Math.random() * lines.length)];
                    for (var i = 0; i < randomLine.length; i++) {
                        p.textContent += randomLine.charAt(i);
                        await sleep(120); // 120毫秒一个字，你可以按喜好调
                    }
                    await sleep(2000); // 打完后停顿 2 秒
                    var original = p.textContent;
                    for (var j = 0; j < original.length; j++) {
                        p.textContent = original.slice(0, -j - 1); // 删除最后一个字
                        await sleep(50); // 50毫秒删除一个字
                    }
                    p.textContent = ''; // 清空文本
                }
            } catch (e) {
                console.error('打字机加载失败:', e);
            }
        }

        main();
        typeWriter();
    </script>
</body>

</html>
