name: Add Website

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add_website:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'new-site')
    steps:
      - name: 复制仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 处理git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 执行收录脚本
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: chmod +x ./add_website_for_issue.sh && bash ./add_website_for_issue.sh
      - name: 回复 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const reply = `${{ steps.process.outputs.reply }}`;
            if (reply) {
              github.rest.issues.createComment({
                issue_number: ${{ github.event.issue.number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reply
              });
              // 2. 如果回复以 ✅ 开头，说明收录成功，关闭 Issue
              if (reply.trim().startsWith('✅') || reply.trim().startsWith('ℹ️')) {
                await github.rest.issues.update({
                  issue_number: ${{ github.event.issue.number }},
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  state_reason: 'completed'   // 标记为“已完成”
                });
              }
            }